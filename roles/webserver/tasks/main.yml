---
- name: Install web server
  apt:
    name: "{{ webserver_package }}"
    state: present
    update_cache: yes

- name: Start and enable web server
  service:
    name: "{{ webserver_service }}"
    state: started
    enabled: yes

- name: Deploy webpage template
  template:
    src: index.html.j2
    dest: /var/www/html/index.html
  notify: Restart webserver
